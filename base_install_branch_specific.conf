#!/bin/bash -e

# this file gets sourced during the final installation, right before the euro-office installation docker call

# leave this empty to autodetect and use the hostname provided by DNS/DHCP/whatever name resolution you have
EURO_OFFICES_HOSTNAME=""

# set this to the TCP port you want to use for your euro-office docker instance (default: 8080)
EURO_OFFICE_PORT=8080

# set the secret string (in plaintext) to be used as JWT_SECRET
# you may set this to a different password than the one you specified for your "default user" during Raspberry Pi OS installation
# leave it empty to have one auto-generated for you
EURO_OFFICE_JWT_SECRET=""

# set the amount of maximum concurrent downloads for docker - values greater than one seem to cause problems
EURO_OFFICE_MAX_CONC_DL=1
